services:
  db-core: 
    image: postgres:16
    container_name: finanzas-db-core-2
    environment:
      POSTGRES_DB: finanzas_core
      POSTGRES_USER: finanzas_user
      POSTGRES_PASSWORD: finanzas_pass
    ports:
      - "5435:5432"
    volumes:
      - db_core_data:/var/lib/postgresql/data
    networks:
      - finanzas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas_user -d finanzas_core"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_core_data:
networks:
  finanzas-network:
      driver: bridge